name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: dotnet format check
        shell: pwsh
        run: dotnet format GrokMcp.sln --verify-no-changes --severity warn

      - name: dotnet test
        shell: pwsh
        run: dotnet test tests/GrokMcp.Tests/GrokMcp.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: dotnet publish
        shell: pwsh
        run: dotnet publish GrokMcp.csproj -c Release -o bin\win-x64

      - name: Boot smoke (missing key must exit 2)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "bin\win-x64\grok-mcp.exe" `
            -PassThru -NoNewWindow `
            -RedirectStandardError stderr.log -RedirectStandardOutput stdout.log
          if (-not $proc.WaitForExit(5000)) {
            $proc.Kill()
            throw "Process did not exit within 5s; expected fail-fast on missing key."
          }
          if ($proc.ExitCode -ne 2) {
            Get-Content stderr.log
            throw "Expected exit code 2 (missing XAI_API_KEY), got $($proc.ExitCode)."
          }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: dotnet test
        run: dotnet test tests/GrokMcp.Tests/GrokMcp.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: dotnet publish
        run: dotnet publish GrokMcp.csproj -c Release -o bin/linux

      - name: Boot smoke (missing key must exit 2)
        run: |
          # Empty HOME so no config.env from the runner can supply a key.
          code=0
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME HOME="$(mktemp -d)" XAI_API_KEY= \
            timeout 5 bin/linux/grok-mcp || code=$?
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 (missing XAI_API_KEY), got $code."
            exit 1
          fi

      - name: Install script syntax
        run: bash -n scripts/install-linux.sh
